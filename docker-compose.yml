version: "3.9"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ashenta_db
      POSTGRES_USER: ashenta
      POSTGRES_PASSWORD: ashenta_pass
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ashenta"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://ashenta:ashenta_pass@db:5432/ashenta_db
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - yolo_cache:/root/.cache

volumes:
  pgdata:
  yolo_cache:
